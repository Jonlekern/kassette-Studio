<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Étiquette de K7</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,500&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes tourner{to{transform:rotate(360deg)}}
.tourne{animation:tourner 1.8s linear infinite}
</style>
</helmet>
<div style="width: 312px; height: 224px; box-sizing: border-box; background: #14283a; color: #e8eef2; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-family: 'Space Mono', monospace">
<div style="display: flex; gap: 10px; align-items: center">
<img src="/_blob/9182f963b511a7252a24bcb8714d45da" alt="" style="width: 40px; height: 40px; object-fit: cover; display: block">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 21px; line-height: 1">An Afternoon at the Lake</span><span style="font-size: 10px; letter-spacing: 1px">JEREMY SADIK</span></div>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 700; line-height: 0.8">{{face}}</span>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 9px">
<span>NR B</span>
<sc-if value="{{bobines}}" hint-placeholder-val="{{false}}">
<div style="width: 176px; height: 66px; background: #0d1b28; border: 1px solid #0a121a; border-radius: 30px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-around; padding: 0 10px">
<div style="width: 48px; height: 48px; border-radius: 50%; background: #5a3b22; display: flex; align-items: center; justify-content: center"><div class="tourne" style="width: 26px; height: 26px; border-radius: 50%; background: #f5f5f5; border: 4px dashed #3a3a3a; box-sizing: border-box"></div></div>
<div style="width: 40px; height: 16px; background: #111; border: 1px solid #555"></div>
<div style="width: 36px; height: 36px; border-radius: 50%; background: #5a3b22; display: flex; align-items: center; justify-content: center"><div class="tourne" style="width: 26px; height: 26px; border-radius: 50%; background: #f5f5f5; border: 4px dashed #3a3a3a; box-sizing: border-box"></div></div>
</div>
</sc-if>
<sc-if value="{{sansBobines}}" hint-placeholder-val="{{true}}">
<div style="width: 176px; height: 66px; border: 1px dashed #e8eef2; border-radius: 30px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #8fa6b5">fenêtre · non imprimée</div>
</sc-if>
<span>C60</span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 8px; letter-spacing: 1px"><span>TDK SA60 · TYPE II · DOLBY B</span><span>LAFLEURSTUDIO · LFS-001</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"face":{"editor":"enum","options":["A","B"],"default":"A"},"bobines":{"editor":"boolean","default":false},"$preview":{"width":312,"height":224}}'>
class Component extends DCLogic {
renderVals() {
const bobines = this.props.bobines === true || this.props.bobines === "true";
return { face: this.props.face ?? 'A', bobines, sansBobines: !bobines };
}
}
</script>
</body>
</html>
