name: Compilation macOS

on:
  push:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Version de Swift
        run: swift --version
      - name: Compiler
        run: |
          swift build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Tests
        run: |
          swift test 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      - name: Fabriquer LaFleurStudio.app
        run: |
          ./construire-app.sh
          cd dist && ditto -c -k --keepParent LaFleurStudio.app LaFleurStudio.zip
      - name: Mettre l'app en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: LaFleurStudio
          path: app/dist/LaFleurStudio.zip
          retention-days: 30
      - name: Extraire les textes à traduire
        continue-on-error: true
        run: |
          mkdir -p chaines
          swift build -Xswiftc -emit-localized-strings -Xswiftc -emit-localized-strings-path -Xswiftc "$PWD/chaines" 2>&1 | tail -5
          find chaines .build -name "*.stringsdata" -newer Package.swift 2>/dev/null | head -50
          find chaines .build -name "*.stringsdata" -newer Package.swift -exec cp {} chaines/ \; 2>/dev/null || true
          python3 Ressources/Langues/generer.py --verifier chaines || true
      - name: Captures des écrans et des jaquettes
        continue-on-error: true
        run: |
          perl -e 'alarm 300; exec @ARGV' dist/LaFleurStudio.app/Contents/MacOS/LaFleurStudio --captures "$PWD/captures"
          ls -la captures
          cat captures/journal.txt || true
      - name: Mettre les captures en téléchargement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Captures
          path: |
            app/captures
            app/chaines
          retention-days: 14
          if-no-files-found: ignore
      - name: Détail des erreurs (seulement si ça échoue)
        if: failure()
        run: |
          grep -h -E "error:" build.log test.log 2>/dev/null | sort -u | head -80 || true
