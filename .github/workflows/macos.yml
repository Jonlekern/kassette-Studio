name: Compilation macOS

on:
  push:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Version de Swift
        run: swift --version
      - name: Compiler
        run: |
          swift build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Tests
        run: |
          swift test 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      - name: Fabriquer LaFleurStudio.app
        run: |
          ./construire-app.sh
          cd dist && ditto -c -k --keepParent LaFleurStudio.app LaFleurStudio.zip
      - name: Mettre l'app en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: LaFleurStudio
          path: app/dist/LaFleurStudio.zip
          retention-days: 30
      - name: Publier la dernière version (page Releases, lien de téléchargement du README)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/etape-1')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          cat > notes.md <<EOF
          Télécharge **LaFleurStudio.zip** ci-dessous, dézippe, glisse l'app dans Applications.

          Premier lancement : Réglages Système → Confidentialité et sécurité → **Ouvrir quand même**
          (l'app n'est pas signée par Apple). Mode d'emploi complet sur la page d'accueil du projet.

          Version du $(date -u +%d.%m.%Y), code ${GITHUB_SHA::7}.
          EOF
          gh release create derniere-version dist/LaFleurStudio.zip --target "$GITHUB_SHA" --latest \
            --title "LaFleurStudio — dernière version" --notes-file notes.md
      - name: Extraire les textes à traduire
        continue-on-error: true
        run: |
          mkdir -p chaines
          swift build -Xswiftc -emit-localized-strings -Xswiftc -emit-localized-strings-path -Xswiftc "$PWD/chaines" 2>&1 | tail -5
          find chaines .build -name "*.stringsdata" -newer Package.swift 2>/dev/null | head -50
          find chaines .build -name "*.stringsdata" -newer Package.swift -exec cp {} chaines/ \; 2>/dev/null || true
          python3 Ressources/Langues/generer.py --verifier chaines || true
      - name: Captures des écrans et des jaquettes
        continue-on-error: true
        run: |
          perl -e 'alarm 300; exec @ARGV' dist/LaFleurStudio.app/Contents/MacOS/LaFleurStudio --captures "$PWD/captures"
          perl -e 'alarm 300; exec @ARGV' dist/LaFleurStudio.app/Contents/MacOS/LaFleurStudio -AppleLanguages "(en)" --captures "$PWD/captures/en" || true
          perl -e 'alarm 300; exec @ARGV' dist/LaFleurStudio.app/Contents/MacOS/LaFleurStudio -AppleLanguages "(ru)" --captures "$PWD/captures/ru" || true
          perl -e 'alarm 300; exec @ARGV' dist/LaFleurStudio.app/Contents/MacOS/LaFleurStudio -AppleLanguages "(de)" --captures "$PWD/captures/de" || true
          ls -la captures
          cat captures/journal.txt || true
      - name: Mettre les captures en téléchargement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Captures
          path: |
            app/captures
            app/chaines
          retention-days: 14
          if-no-files-found: ignore
      - name: Détail des erreurs (seulement si ça échoue)
        if: failure()
        run: |
          grep -h -E "error:" build.log test.log 2>/dev/null | sort -u | head -80 || true
